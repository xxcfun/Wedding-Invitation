<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>婚礼留言管理</title>
<style>
:root{font-family:system-ui,sans-serif;color:#29382f;background:#f5f4eb}body{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:26px}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #778574;border-radius:8px}button{min-height:44px;padding:10px 18px;margin:12px 8px 4px 0;font:inherit;border:1px solid #647b64;border-radius:8px;background:#edf2e5;color:#29382f;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #39725b;outline-offset:3px}article{padding:18px;margin:16px 0;border:1px solid #b6bba7;background:#fffdf4;border-radius:12px;overflow-wrap:anywhere}article p{white-space:pre-wrap;line-height:1.7}small{color:#52634e}#status{min-height:24px}input{margin-bottom:8px}
</style></head><body><h1>婚礼留言管理</h1><p>管理密钥只保留在当前页面内存中，关闭页面后需重新输入。</p>
<form id="login"><label for="token">管理密钥</label><input id="token" type="password" autocomplete="off" required minlength="32"><button type="submit">加载留言</button><button type="button" id="logout">退出并清除密钥</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="items" aria-label="留言列表"></section><button id="more" hidden>查看更多</button><script src="/admin.js" defer></script></body></html>
